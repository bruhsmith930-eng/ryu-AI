<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>QTerm</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;color:#0f0;
    font-family:'Courier New',monospace;font-size:14px;overflow:hidden}
  #term{height:100%;display:flex;flex-direction:column}
  #out{flex:1;overflow-y:auto;padding:10px;white-space:pre-wrap;word-break:break-word;
    -webkit-overflow-scrolling:touch}
  #bar{display:flex;border-top:1px solid #0f0}
  #inp{flex:1;background:#000;color:#0f0;border:none;outline:none;
    padding:10px;font-family:inherit;font-size:14px}
  #send{background:#0f0;color:#000;border:none;padding:10px 16px;font-weight:bold}
  .cmd{color:#0ff}
  .err{color:#f55}
  .ok{color:#0f0}
  .dim{color:#0a0}
</style></head>
<body>
<div id="term">
  <div id="out"></div>
  <div id="bar">
    <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ketik perintah...">
    <button id="send">▶</button>
  </div>
</div>
<script>
var out=document.getElementById('out'),
    inp=document.getElementById('inp'),
    send=document.getElementById('send'),
    fs={}, cwd='/', hist=[], hi=-1;

function norm(p){
  p=p||'/';
  if(p[0]!=='/')p=cwd+(cwd==='/'?'':'/')+p;
  var a=p.split('/'),s=[],i;
  for(i=0;i<a.length;i++){
    if(!a[i]||a[i]==='.')continue;
    if(a[i]==='..'){s.pop();continue;}
    s.push(a[i]);
  }
  return '/'+s.join('/');
}
function print(t,c){
  var d=document.createElement('div');
  if(c)d.className=c;
  d.textContent=t;
  out.appendChild(d);
  out.scrollTop=out.scrollHeight;
}
function ls(p){
  var list=[],k;
  for(k in fs){ if(k.indexOf(p=== '/'? p : p+'/')===0){
    var rest=k.substring(p==='/'?1:p.length+1);
    if(rest && rest.indexOf('/')===-1 && list.indexOf(rest)===-1)list.push(rest);
  }}
  if(p!=='/'){ for(k in fs){ if(fs[k].dir){
    var d=k.substring(1);
    if(d.indexOf(p==='/'?'':p.substring(1)+'/')===0 && d!==p.substring(1)){
      var r2=d.substring(p==='/'?0:p.length);
      /* abaikan */
    }
  }}}
  return list.sort();
}
function dirs(){
  var s={'/':1},k;
  for(k in fs)if(fs[k].dir)s[k]=1;
  return s;
}
function run(line){
  print('$ '+line,'cmd');
  var a=line.trim().split(/\s+/),c=a[0],arg=a.slice(1).join(' ');
  if(!c)return;
  var p=norm(arg);
  switch(c){
    case 'help':
      print('Perintah: help ls cd mkdir touch cat echo rm pwd clear date whoami echo','ok');
      print('Contoh: mkdir notes | touch notes/a.txt | echo halo > notes/a.txt | cat notes/a.txt','dim');
      break;
    case 'pwd': print(cwd); break;
    case 'whoami': print('pemilik-hp'); break;
    case 'date': print(new Date().toString()); break;
    case 'clear': out.innerHTML=''; break;
    case 'ls':
      var t=arg?p:cwd, L=ls(t), D=dirs(), k, names=[], n;
      for(n in D){ if(n.indexOf(t==='/'?'/':t+'/')===0){
        var r=n.substring(t==='/'?1:t.length+1);
        if(r && r.indexOf('/')===-1 && names.indexOf(r+'/')===-1)names.push(r+'/');
      }}
      names=names.concat(L).sort();
      print(names.length?names.join('   '):'(kosong)');
      break;
    case 'cd':
      if(!arg){cwd='/';print(cwd,'dim');break;}
      if(dirs()[p]){cwd=p;print(cwd,'dim');}
      else print('cd: bukan folder: '+p,'err');
      break;
    case 'mkdir':
      if(!arg){print('mkdir: butuh nama','err');break;}
      fs[p]={dir:1}; print('folder dibuat: '+p,'ok'); break;
    case 'touch':
      if(!arg){print('touch: butuh nama','err');break;}
      if(!fs[p])fs[p]={dir:0,text:''};
      print('file siap: '+p,'ok'); break;
    case 'cat':
      if(!arg){print('cat: butuh nama file','err');break;}
      if(fs[p]&&!fs[p].dir)print(fs[p].text||'(kosong)');
      else print('cat: file tidak ada: '+p,'err');
      break;
    case 'echo':
      var m=arg.match(/^([\s\S]*?)\s*>\s*(\S+)$/);
      if(m){
        var fp=norm(m[2]);
        fs[fp]={dir:0,text:m[1]};
        print('tersimpan ke '+fp,'ok');
      } else print(arg);
      break;
    case 'rm':
      if(!arg){print('rm: butuh nama','err');break;}
      if(fs[p]&&fs[p].dir){
        var pre=p==='/'?'/':p+'/', k2;
        for(k2 in fs)if(k2.indexOf(pre)===0)delete fs[k2];
        delete fs[p]; print('folder dihapus: '+p,'ok');
      } else if(fs[p]){ delete fs[p]; print('file dihapus: '+p,'ok'); }
      else print('rm: tidak ada: '+p,'err');
      break;
    default:
      print('perintah tidak dikenal: '+c+'  (ketik: help)','err');
  }
}
function go(){
  var v=inp.value; inp.value='';
  if(v.trim()){hist.push(v);hi=hist.length;}
  run(v);
}
send.onclick=go;
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter')go();
  if(e.key==='ArrowUp'){if(hi>0){hi--;inp.value=hist[hi];}e.preventDefault();}
  if(e.key==='ArrowDown'){if(hi<hist.length-1){hi++;inp.value=hist[hi];}else{hi=hist.length;inp.value='';}e.preventDefault();}
});
fs['/selamat-datang.txt']={dir:0,text:'Halo! Ini QTerm milik Anda.\nKetik: help'};
print('QTerm v1.0 — terminal pribadi Anda','ok');
print('Offline. Tanpa akun. Tanpa install.','dim');
print('Ketik: help','dim');
inp.focus();
</script>
</body></html>
