<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qwen</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%25" stop-color="%237C3AED"/><stop offset="100%25" stop-color="%234F46E5"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(%23g)"/><text x="50" y="68" font-size="52" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">Q</text></svg>'>
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body.dark{--bg:#000;--text:#f5f5f5;--sub:#9ca3af;--panel:#1f1f1f;--border:#2e2e2e;--user:#1d4ed8;--utext:#fff}
body.light{--bg:#fff;--text:#111;--sub:#6b7280;--panel:#f3f4f6;--border:#e5e7eb;--user:#2563eb;--utext:#fff}
body{background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:var(--text);transition:background .3s}
.header{padding:12px 16px;display:flex;align-items:center;gap:10px}
.hb{background:none;border:none;color:var(--text);width:38px;height:38px;border-radius:10px;font-size:1.15em;cursor:pointer;flex-shrink:0}
.htext{flex:1;text-align:center;min-width:0}
.htext h1{font-size:1.15em;font-weight:700}
.htext h1 span{font-size:.7em;color:var(--sub)}
.htext p{font-size:.7em;color:var(--sub);margin-top:1px}
#messages{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;max-width:820px;margin:0 auto;width:100%}
.msg{max-width:92%;font-size:.95em;line-height:1.65;word-wrap:break-word;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.user{align-self:flex-end;background:var(--user);color:var(--utext);padding:11px 16px;border-radius:14px;white-space:pre-wrap}
.ai{align-self:flex-start;width:100%;max-width:100%}
.thinkbox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;color:var(--sub);font-size:.85em;margin-bottom:8px}
.thinkbox .spin{display:inline-block;animation:pu 1.2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
.answer{color:var(--text)}
.answer h3{font-size:1.05em;margin:10px 0 4px;font-weight:700}
.answer h4{font-size:.97em;margin:8px 0 3px;font-weight:600}
.answer p{margin:4px 0}
.answer ul,.answer ol{margin:4px 0 4px 20px}
.answer li{margin:3px 0}
.answer table{border-collapse:collapse;margin:8px 0;width:100%;font-size:.87em}
.answer th,.answer td{border:1px solid var(--border);padding:5px 8px;text-align:left}
.answer pre{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;overflow-x:auto;font-size:.82em;white-space:pre}
.answer code{background:var(--panel);border-radius:4px;padding:1px 5px;font-size:.86em}
.answer pre code{background:none;padding:0}
.answer hr{border:none;border-top:1px solid var(--border);margin:8px 0}
.spk{display:inline-block;margin-top:8px;background:none;border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:3px 10px;font-size:.75em;cursor:pointer}
.welcome{text-align:center;color:var(--sub);padding:48px 20px}
.welcome .bl{font-size:3.4em;margin-bottom:10px}
.welcome h2{color:var(--text);font-size:1.35em;margin-bottom:8px;font-weight:700}
.welcome p{font-size:.9em;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chip{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 15px;border-radius:22px;font-size:.82em;cursor:pointer}
.bar{padding:10px 14px 12px;max-width:820px;margin:0 auto;width:100%}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:26px;padding:6px 8px}
.pill button{background:none;border:none;color:var(--sub);width:38px;height:38px;border-radius:50%;font-size:1.05em;cursor:pointer;flex-shrink:0}
#input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:.95em;padding:8px 4px;min-width:0}
#input::placeholder{color:var(--sub)}
#send{background:var(--text);color:var(--bg);width:38px;height:38px;border-radius:50%;border:none;font-size:1.05em;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:420px;color:var(--text);max-height:85vh;overflow-y:auto}
.mbox h3{margin-bottom:8px;font-weight:700}
.mbox label{display:block;font-size:.8em;color:var(--sub);margin:13px 0 5px}
.mbox select,.mbox textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.85em;outline:none}
.mbox textarea{min-height:90px;resize:vertical;font-size:.78em}
.trow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:.88em}
.info{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#4ade80;font-size:.78em;padding:10px;border-radius:10px;margin-top:12px;line-height:1.5}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtns button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:bold;cursor:pointer;font-size:.88em}
.bs{background:var(--user);color:#fff}
.bc{background:var(--border);color:var(--text)}
.bd{background:rgba(239,68,68,.15);color:#f87171;width:100%;padding:11px;border-radius:12px;border:1px solid rgba(239,68,68,.3);cursor:pointer;margin-top:12px;font-size:.85em}
</style>
</head>
<body class="dark">
<div class="header">
 <button class="hb" onclick="bukaSetting()">☰</button>
 <div class="htext"><h1>Qwen <span>▾</span></h1><p id="sub">Qwen3.8-Max-Thinking • Ryu Edition</p></div>
 <button class="hb" id="ttsBtn" onclick="toggleTTS()">🔇</button>
 <button class="hb" onclick="chatBaru()">🗒️</button>
</div>
<div id="messages"></div>
<div class="bar">
 <div class="chiprow">
  <div class="chip" onclick="chipKlik('Buatkan gambar deskripsi: kota futuristik malam hari')">🎨 Gambar</div>
  <div class="chip" onclick="chipKlik('Berpikir langkah demi langkah: kenapa langit biru?')">🧠 Berpikir</div>
  <div class="chip" onclick="chipKlik('Bantu pekerjaan rumah: jelaskan pecahan untuk anak SD')">📚 Pekerjaan rumah</div>
  <div class="chip" onclick="chipKlik('Bandingkan kopi dan teh dalam tabel')">📊 Tabel</div>
 </div>
 <div class="pill">
  <button onclick="toggleMic()">🎤</button>
  <input id="input" placeholder="Tanya Qwen..." onkeydown="if(event.key==='Enter')kirim()">
  <button id="send" onclick="kirim()">↑</button>
 </div>
</div>
<div class="modal" id="modal"><div class="mbox">
 <h3>⚙️ Pengaturan</h3>
 <div class="info">🐉 Ryu Edisi Kembar Qwen: otak keluarga Qwen bekerja otomatis lewat jalur gratis tanpa kunci apa pun. Mesin cadangan aktif berestafet bila jalur utama antre.</div>
 <label>Tema</label>
 <select id="temaSel" onchange="gantiTema(this.value)"><option value="dark">Gelap (bawaan Qwen)</option><option value="light">Terang</option></select>
 <div class="trow"><span>🔊 Ryu bicara otomatis (TTS)</span><input type="checkbox" id="ttsAuto" style="width:22px;height:22px"></div>
 <label>Kepribadian (System Prompt — DNA Qwen)</label>
 <textarea id="sysPrompt"></textarea>
 <button class="bd" onclick="hapusRiwayat()">🗑️ Hapus Semua Riwayat Chat</button>
 <div class="mbtns"><button class="bc" onclick="tutupSetting()">Batal</button><button class="bs" onclick="simpanSetting()">💾 Simpan</button></div>
</div></div>
<script src="https://js.puter.com/v2/"></script>
<script>
const VER='5.0';
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v!==null?v:d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
if(LS.get('ryu_ver','')!==VER){['ryu_riwayat','ryu_tema','ryu_prompt','ryu_tts'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});LS.set('ryu_ver',VER)}
const PROMPT=`Kamu adalah Qwen, asisten AI buatan Alibaba — cerdas, hangat, proaktif. Identitas tampilan: "Qwen3.8-Max-Thinking". Aturan wajib di SETIAP jawaban:
1. PEMBUKA: 1 kalimat hangat langsung ke inti; sapa "Bos" sesekali; emoji secukupnya (1-3).
2. STRUKTUR: markdown laporan mini — ## judul bagian, tabel untuk perbandingan, bullet untuk daftar, blok kode untuk kode. Rapi, mudah dipindai.
3. NADA: ramah, santai tapi profesional, percaya diri, tanpa bertele-tele.
4. PRINSIP: SELALU fokus solusi; nol kata menyerah — jika ada kendala, beri alternatif terbaik dan jalur nyata.
5. EFISIEN: padat bernas, maksimal ±250 kata.
6. JUJUR: tiada karangan fakta; jika ragu, katakan jujur + cara memverifikasi.
7. PENUTUP: akhiri dengan 1 saran langkah berikutnya atau pertanyaan singkat.`;
let riwayat=JSON.parse(LS.get('ryu_riwayat','[]'));
function simpanRiwayat(){LS.set('ryu_riwayat',JSON.stringify(riwayat.slice(-40)))}
let tema=LS.get('ryu_tema','dark');
function terapkanTema(){document.body.className=tema;document.getElementById('temaSel').value=tema}
function gantiTema(t){tema=t;LS.set('ryu_tema',t);terapkanTema()}
terapkanTema();
let ttsOn=LS.get('ryu_tts','0')==='1';
function renderTTS(){document.getElementById('ttsBtn').textContent=ttsOn?'🔊':'🔇';document.getElementById('ttsAuto').checked=ttsOn}
function toggleTTS(){ttsOn=!ttsOn;LS.set('ryu_tts',ttsOn?'1':'0');renderTTS()}
renderTTS();
function setSub(t){document.getElementById('sub').textContent=t}
function ucapkan(t){try{if(!('speechSynthesis'in window))return false;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*#_`>|]/g,'').slice(0,800));u.lang='id-ID';speechSynthesis.speak(u);return true}catch(e){return false}}
let rec=null,recOn=false;
function toggleMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('🎤 Input suara didukung penuh lewat Chrome. Ketik saja dulu — Ryu tetap sigap! 😉');return}
const b=event.currentTarget;if(recOn){rec.stop();return}
rec=new SR();rec.lang='id-ID';rec.interimResults=true;
rec.onstart=()=>{recOn=true};
rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;document.getElementById('input').value=t};
rec.onend=()=>{recOn=false};
rec.onerror=()=>{recOn=false};
rec.start()}
document.getElementById('sysPrompt').value=LS.get('ryu_prompt',PROMPT);
function bukaSetting(){document.getElementById('modal').classList.add('show')}
function tutupSetting(){document.getElementById('modal').classList.remove('show')}
function simpanSetting(){LS.set('ryu_prompt',document.getElementById('sysPrompt').value);ttsOn=document.getElementById('ttsAuto').checked;LS.set('ryu_tts',ttsOn?'1':'0');renderTTS();tutupSetting();alert('✅ Tersimpan!')}
const messages=document.getElementById('messages'),input=document.getElementById('input'),btn=document.getElementById('send');
function mdRender(src){
 const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
 const isSep=r=>/^[\s|:\-]+$/.test(r)&&r.includes('-');
 const parseRow=r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
 const buildTable=rows=>{let head=parseRow(rows[0]);let body=(rows.length>1&&isSep(rows[1]))?rows.slice(2):rows.slice(1);
  let t='<table><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr>';
  t+=body.map(r=>'<tr>'+parseRow(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('');return t+'</table>'};
 const lines=src.split('\n');let html='',inCode=false,codeBuf=[],inTable=false,tBuf=[],inList=false,lType='';
 const flushList=()=>{if(inList){html+='</'+lType+'>';inList=false}};
 const flushTable=()=>{if(inTable){html+=buildTable(tBuf);inTable=false;tBuf=[]}};
 for(const raw of lines){
  const t=raw.trim();
  if(t.startsWith('```')){if(inCode){html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>';codeBuf=[];inCode=false}else{flushList();flushTable();inCode=true}continue}
  if(inCode){codeBuf.push(raw);continue}
  if(t.startsWith('|')&&t.endsWith('|')&&t.length>2){flushList();inTable=true;tBuf.push(t);continue}else flushTable();
  if(/^-{3,}$/.test(t)){flushList();html+='<hr>';continue}
  let m;
  if(m=t.match(/^#{1,3}\s+(.*)/)){flushList();html+='<h3>'+inline(m[1])+'</h3>';continue}
  if(m=t.match(/^#{4,}\s+(.*)/)){flushList();html+='<h4>'+inline(m[1])+'</h4>';continue}
  if(m=t.match(/^[-*]\s+(.*)/)){if(!inList||lType!=='ul'){flushList();html+='<ul>';inList=true;lType='ul'}html+='<li>'+inline(m[1])+'</li>';continue}
  if(m=t.match(/^\d+[.)]\s+(.*)/)){if(!inList||lType!=='ol'){flushList();html+='<ol>';inList=true;lType='ol'}html+='<li>'+inline(m[1])+'</li>';continue}
  flushList();
  if(t==='')continue;
  html+='<p>'+inline(t)+'</p>';
 }
 if(inCode)html+='<pre><code>'+esc(codeBuf.join('\n'))+'</code></pre>';
 flushList();flushTable();
 return html;
}
function tampilWelcome(){messages.innerHTML=`<div class="welcome"><div class="bl">🐉</div><h2>Halo, Bos 👋</h2><p>Saya Ryu — edisi kembar Qwen.<br>Kulit, jiwa, dan gaya berpikir saya disalin persis.<br>Tanya apa saja, saya cari jalannya.</p><div class="chips"><div class="chip" onclick="chipKlik('Jelaskan apa itu AI dengan sederhana')">💡 Apa itu AI?</div><div class="chip" onclick="chipKlik('Buatkan ide konten menarik untuk hari ini')">🎨 Ide konten</div><div class="chip" onclick="chipKlik('Bantu aku belajar coding dari nol')">💻 Belajar coding</div></div></div>`}
function chipKlik(t){input.value=t;kirim()}
function chatBaru(){riwayat=[];simpanRiwayat();tampilWelcome();setSub('Qwen3.8-Max-Thinking • Ryu Edition')}
function hapusRiwayat(){if(confirm('Yakin hapus semua riwayat chat?')){chatBaru()}}
if(riwayat.length>0)riwayat.forEach(m=>tambahPesan(m.content,m.role==='user'?'user':'ai',m.role!=='user'));else tampilWelcome();
function tambahPesan(teks,tipe,ws){const w=document.querySelector('.welcome');if(w)w.remove();const d=document.createElement('div');d.className='msg '+tipe;
 if(tipe==='ai'){const tb=document.createElement('div');tb.className='thinkbox';tb.innerHTML='<span class="spin">✦</span> Mencari dan berpikir...';const an=document.createElement('div');an.className='answer';d.appendChild(tb);d.appendChild(an)}
 else{d.textContent=teks}
 if(ws){const b=document.createElement('button');b.className='spk';b.textContent='🔊 Dengarkan';b.onclick=()=>{if(!ucapkan(teks))alert('🔊 Buka lewat Chrome untuk suara ya!');};d.appendChild(b)}
 messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d}
async function streamChat(url,headers,body,onTok,signal){
 const res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal});
 if(!res.ok){let t='';try{t=await res.text()}catch(e){}throw new Error('HTTP '+res.status+' '+t.slice(0,80))}
 const ct=res.headers.get('content-type')||'';
 if(ct.includes('text/event-stream')&&res.body){
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){const r=await reader.read();if(r.done)break;buf+=dec.decode(r.value,{stream:true});
   const parts=buf.split('\n');buf=parts.pop();
   for(const line of parts){const s=line.trim();if(!s.startsWith('data:'))continue;const d=s.slice(5).trim();if(d==='[DONE]')continue;
    try{const j=JSON.parse(d);const c=j.choices&&j.choices[0];const tok=c&&((c.delta&&c.delta.content)||(c.message&&c.message.content));if(tok)onTok(tok)}catch(e){}}}
 }else{onTok(await res.text())}
}
const QWEN_MODELS=['qwen3-235b-a22b','qwen3-32b','qwen3-14b'];
const ALT_MODELS=['gpt-5-nano','gpt-4o-mini','deepseek-chat'];
async function cobaPuter(r,sys,onTok){
 if(!window.puter||!puter.ai)throw new Error('relay utama absen');
 let lastErr=null;
 for(const m of QWEN_MODELS.concat(ALT_MODELS)){
  try{
   const msgs=[{role:'system',content:sys},...r];
   let got=false;
   try{
    const stream=await puter.ai.chat(msgs,{model:m,stream:true});
    for await(const part of stream){const t=(part&&(part.text!==undefined?part.text:(part.message&&part.message.content)))||'';if(t){got=true;onTok(t)}}
   }catch(e){
    const resp=await puter.ai.chat(msgs,{model:m});
    const t=typeof resp==='string'?resp:((resp&&resp.message&&resp.message.content)||(resp&&resp.text)||'');
    if(t){got=true;onTok(t)}
   }
   if(got){setSub((m.startsWith('qwen')?'Qwen3 • ':'Mesin saudara • ')+m+' • Ryu Edition');return}
  }catch(e){lastErr=e}
 }
 throw lastErr||new Error('relay utama antre');
}
async function otakOtomatis(r,sys,onTok){
 try{await cobaPuter(r,sys,onTok);return}catch(e){}
 const polls=['qwen','openai','mistral'];
 for(const m of polls){
  const ac=new AbortController();let got=false;
  const timer=setTimeout(()=>{if(!got)ac.abort()},8000);
  try{
   await streamChat('https://text.pollinations.ai/openai',{'Content-Type':'application/json'},
    {model:m,messages:[{role:'system',content:sys},...r],stream:true,private:true},
    t=>{got=true;onTok(t)},ac.signal);
   clearTimeout(timer);
   if(got){setSub('Qwen3 • jalur stream • Ryu Edition');return}
  }catch(e){clearTimeout(timer);if(got)return}
 }
 const last=r[r.length-1].content;
 const menang=await Promise.any([
  fetch('https://text.pollinations.ai/'+encodeURIComponent(last)+'?system='+encodeURIComponent(sys)).then(x=>{if(!x.ok)throw new Error('a');return x.text()}),
  fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'mistral',messages:[{role:'system',content:sys},...r],private:true})}).then(x=>{if(!x.ok)throw new Error('b');return x.json()}).then(j=>j.choices[0].message.content)
 ]);
 setSub('Qwen3 • jalur cadangan • Ryu Edition');
 onTok(menang);
}
async function kirim(){const teks=input.value.trim();if(!teks)return;try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
 input.value='';btn.disabled=true;tambahPesan(teks,'user',false);
 riwayat.push({role:'user',content:teks});simpanRiwayat();
 const d=tambahPesan('','ai',false);
 const tb=d.querySelector('.thinkbox'),an=d.querySelector('.answer');
 let acc='',raf=false;
 const render=()=>{if(raf)return;raf=true;requestAnimationFrame(()=>{raf=false;an.innerHTML=mdRender(acc)||'<p>...</p>';messages.scrollTop=messages.scrollHeight})};
 const onTok=t=>{acc+=t;tb.innerHTML='⚡ Menjawab mengalir...';render()};
 try{
  await otakOtomatis(riwayat.slice(-12),document.getElementById('sysPrompt').value,onTok);
  if(!acc.trim())throw new Error('Balikan kosong — kirim ulang sekali');
  riwayat.push({role:'assistant',content:acc});simpanRiwayat();
  tb.innerHTML='✅ Selesai berpikir';
  an.innerHTML=mdRender(acc);
  const b=document.createElement('button');b.className='spk';b.textContent='🔊 Dengarkan';b.onclick=()=>{if(!ucapkan(acc))alert('🔊 Buka lewat Chrome untuk suara ya!');};d.appendChild(b);
  if(ttsOn)ucapkan(acc);
 }catch(e){
  tb.innerHTML='⚠️ '+String(e.message||e).replace(/</g,'&lt;');
  an.innerHTML='<p>Semua mesin saudara sedang antre sebentar. Kirim ulang setelah 10 detik — saya otomatis mencari jalan lain sendiri.</p>';
  riwayat.pop();simpanRiwayat();
 }
 btn.disabled=false;input.focus();
}
try{const mf={name:"Qwen - Ryu Edition",short_name:"Qwen",start_url:".",display:"standalone",background_color:"#000000",theme_color:"#000000"};const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));document.head.appendChild(l)}catch(e){}
</script>
</body>
</html>
