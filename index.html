<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<title>Ryu AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
:root{
  --bg:#0b0a14; --head:rgba(20,18,39,.82); --card:#171530; --card2:#1d1a3a;
  --line:#2c2850; --txt:#e8e6f7; --dim:#9a95c0; --acc:#6c5ce7; --acc2:#8b7bff;
  --code:#12101f; --ok:#2ecc71; --fs:15px;
}
[data-theme="light"]{
  --bg:#f4f3fb; --head:rgba(255,255,255,.85); --card:#ffffff; --card2:#f1effc;
  --line:#ddd8f0; --txt:#221f3a; --dim:#6b6790; --code:#f6f4ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:radial-gradient(1200px 500px at 80% -10%,rgba(108,92,231,.18),transparent),var(--bg);
  color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
/* ===== HEADER ===== */
header{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);
  background:var(--head);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.logo{width:46px;height:46px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(135deg,#7c6cf0,#5a48d6);color:#fff;font-weight:800;font-size:22px;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(108,92,231,.35)}
.htxt{flex:1;min-width:0}
.htxt h1{font-size:20px;font-weight:800;
  background:linear-gradient(90deg,#8b7bff,#b3a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.ibtn{width:42px;height:42px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:18px;cursor:pointer}
.ibtn:active{transform:scale(.94)}
/* ===== CHAT ===== */
#chat{flex:1;overflow-y:auto;padding:16px 0 8px;-webkit-overflow-scrolling:touch}
.msg{max-width:860px;margin:0 auto 14px;padding:0 14px;display:flex}
.m-user{justify-content:flex-end}
.bubble{font-size:var(--fs);line-height:1.55;max-width:88%;padding:11px 15px;word-wrap:break-word}
.m-user .bubble{background:linear-gradient(135deg,var(--acc),#4834d4);color:#fff;
  border-radius:18px 18px 5px 18px;white-space:pre-wrap}
.m-ryu .bubble{background:var(--card);border:1px solid var(--line);border-radius:5px 18px 18px 18px;width:100%;max-width:100%}
.m-ryu h2,.m-ryu h3,.m-ryu h4{color:var(--acc2);margin:12px 0 7px;font-weight:800}
.m-ryu h2{font-size:1.2em}.m-ryu h3{font-size:1.1em}.m-ryu h4{font-size:1em}
.m-ryu p{margin:7px 0}
.m-ryu ul,.m-ryu ol{margin:7px 0 7px 22px}
.m-ryu li{margin:3px 0}
.m-ryu strong{color:var(--acc2)}
code.ic{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.9em;font-family:ui-monospace,Consolas,monospace}
.codebox{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.codehead{display:flex;justify-content:space-between;align-items:center;
  background:var(--card2);padding:8px 12px;color:var(--dim);font-size:12px}
.copybtn{border:none;background:transparent;color:var(--acc2);font-size:12px;font-weight:700;cursor:pointer;padding:4px 6px}
.codebox pre{background:var(--code);padding:12px;overflow-x:auto;font-size:13px;line-height:1.55;
  font-family:ui-monospace,Consolas,monospace;color:var(--txt)}
.dots{display:flex;gap:6px;padding:6px 2px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--acc2);animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
/* ===== FOOTER ===== */
footer{position:sticky;bottom:0;z-index:5;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 35%)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 9px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-size:13px;cursor:pointer}
.chip:active{transform:scale(.95)}
#bar{display:flex;align-items:flex-end;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:8px}
#mic{width:44px;height:44px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);font-size:18px;cursor:pointer}
#mic.rec{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(139,123,255,.25)}
#inp{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--txt);
  font:inherit;font-size:15px;line-height:1.4;max-height:120px;padding:11px 4px}
#inp::placeholder{color:var(--dim)}
#send{width:46px;height:46px;flex:0 0 auto;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--acc2),#4834d4);color:#fff;font-size:18px}
#send:active{transform:scale(.93)}
/* ===== SHEET PENGATURAN ===== */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:15}
#backdrop.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s}
#sheet.open{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px}
#closeSheet{border:none;background:var(--card2);color:var(--txt);width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--dim);padding:8px 2px}
.set-row input{flex:1;accent-color:var(--acc)}
.set-btn{width:100%;margin:7px 0;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--txt);font-size:14px;text-align:left;cursor:pointer}
.set-note{margin-top:10px;font-size:12px;color:var(--dim);text-align:center}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
</style>
</head>
<body>

<header>
  <div class="logo">R</div>
  <div class="htxt">
    <h1>Ryu AI</h1>
    <div class="status"><span class="dot"></span>🐍 Ryu • Otak Qwen3 menyala</div>
  </div>
  <button class="ibtn" id="themeBtn" title="Ganti tema">🌙</button>
  <button class="ibtn" id="setBtn" title="Pengaturan">⚙️</button>
</header>

<main id="chat"></main>

<footer>
  <div id="chips">
    <button class="chip">🔍 Riset fakta</button>
    <button class="chip">🎓 Jelaskan konsep</button>
    <button class="chip">🐞 Debug kode</button>
  </div>
  <div id="bar">
    <button id="mic" title="Suara">🎤</button>
    <textarea id="inp" rows="1" placeholder="Tanya apa saja — Ryu riset dulu"></textarea>
    <button id="send" title="Kirim">➤</button>
  </div>
</footer>

<div id="backdrop"></div>
<div id="sheet">
  <div class="sheet-head">️ Pengaturan <button id="closeSheet">✕</button></div>
  <label class="set-row">Ukuran teks <input type="range" id="fsRange" min="13" max="18" value="15"></label>
  <button class="set-btn" id="clearChat">🧹 Bersihkan percakapan</button>
  <button class="set-btn" id="themeBtn2">🌓 Ganti tema gelap / terang</button>
  <div class="set-note">Ryu AI • tampilan v2.0 bersih • siap offline</div>
</div>

<script>
/* =========================================================
   ZONA OTAK RYU — TEMPAT KODE LAMA ANDA
   Kode otak yang sudah Anda masukkan TIDAK perlu diubah.
   Cukup pastikan ia dipanggil dari function otakRyu() ini.
   Contoh sambungan:
     async function otakRyu(pesan){ return await jawabRyuLama(pesan); }
   Atau pakai Puter.js (gratis, tanpa API key):
     const r = await puter.ai.chat(pesan, {model:'qwen3-max'});
     return r.message ? r.message.content : String(r);
   Jika belum disambung, fallback offline di bawah yang jalan
   (tidak akan pernah error/lempar exception).
========================================================= */
async function otakRyu(pesan){
  return '⚠️ Otak eksternal belum tersambung di file ini.\n\nPesan Anda: **' + pesan + '**\n\nTempel kode otak lama Anda di dalam function `otakRyu()` pada bagian **ZONA OTAK RYU** di skrip ini.';
}
/* ============ akhir zona otak — JS UI di bawah ============ */

var chat=document.getElementById('chat'),inp=document.getElementById('inp'),
    send=document.getElementById('send'),mic=document.getElementById('mic'),
    sheet=document.getElementById('sheet'),backdrop=document.getElementById('backdrop');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function inline(s){var e=esc(s);
  e=e.replace(/`([^`]+)`/g,'<code class="ic">$1</code>');
  e=e.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return e;}
function textBlock(t){
  var lines=t.split('\n'),out='',para=[],list=null,m;
  function fp(){if(para.length){out+='<p>'+para.join('<br>')+'</p>';para=[];}}
  function fl(){if(list){out+='</'+list+'>';list=null;}}
  for(var i=0;i<lines.length;i++){
    var s=lines[i].trim();
    if(!s){fp();fl();continue;}
    if(m=s.match(/^(#{1,3})\s+(.*)$/)){fp();fl();var l=m[1].length+1;out+='<h'+l+'>'+inline(m[2])+'</h'+l+'>';continue;}
    if(m=s.match(/^[-*•]\s+(.*)$/)){fp();if(list!=='ul'){fl();out+='<ul>';list='ul';}out+='<li>'+inline(m[1])+'</li>';continue;}
    if(m=s.match(/^\d+\.\s+(.*)$/)){fp();if(list!=='ol'){fl();out+='<ol>';list='ol';}out+='<li>'+inline(m[1])+'</li>';continue;}
    fl();para.push(inline(s));
  }
  fp();fl();return out;
}
function mdRender(src){
  var parts=String(src).split('```'),html='';
  for(var i=0;i<parts.length;i++){
    if(i%2===1){
      var code=parts[i],lang='code',nl=code.indexOf('\n'),
          first=(nl===-1?code:code.slice(0,nl)).trim();
      if(first&&/^[A-Za-z0-9_+#-]{1,15}$/.test(first)){lang=first;code=nl===-1?'':code.slice(nl+1);}
      html+='<div class="codebox"><div class="codehead"><span>'+esc(lang)+
            '</span><button class="copybtn">📋 Copy</button></div><pre>'+
            esc(code.replace(/\n$/,''))+'</pre></div>';
    }else{html+=textBlock(parts[i]);}
  }
  return html;
}
function scroll(){chat.scrollTop=chat.scrollHeight;}
function bindCopy(scope){
  scope.querySelectorAll('.copybtn').forEach(function(btn){
    btn.onclick=function(){
      var txt=btn.closest('.codebox').querySelector('pre').innerText;
      copyText(txt);
      var old=btn.innerHTML;btn.innerHTML='✅ Tersalin';
      setTimeout(function(){btn.innerHTML=old;},1500);
    };
  });
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(t);}
  var ta=document.createElement('textarea');ta.value=t;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  ta.remove();return Promise.resolve();
}
function addMsg(role,teks){
  var w=document.createElement('div');w.className='msg '+(role==='user'?'m-user':'m-ryu');
  var b=document.createElement('div');b.className='bubble';
  if(role==='user'){b.textContent=teks;}
  else{b.innerHTML=teks;bindCopy(b);}
  w.appendChild(b);chat.appendChild(w);scroll();return w;
}
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';}
async function kirim(){
  var t=inp.value.trim();if(!t)return;
  inp.value='';autosize();
  addMsg('user',t);
  var ty=addMsg('ryu','<div class="dots"><span></span><span></span><span></span></div>');
  try{
    var j=await otakRyu(t);
    ty.querySelector('.bubble').innerHTML=mdRender(j==null?'':j);
    bindCopy(ty.querySelector('.bubble'));
  }catch(e){
    ty.querySelector('.bubble').innerHTML=mdRender('⚠️ Terjadi kesalahan: '+((e&&e.message)?e.message:e));
  }
  scroll();
}
/* tema */
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').textContent=(t==='dark'?'🌙':'☀️');
  try{localStorage.setItem('ryu-theme',t);}catch(e){}
}
function toggleTheme(){
  setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
}
/* init */
try{
  var tt=localStorage.getItem('ryu-theme');if(tt)setTheme(tt);else setTheme('dark');
  var ff=localStorage.getItem('ryu-fs');
  if(ff){document.getElementById('fsRange').value=ff;
    document.documentElement.style.setProperty('--fs',ff+'px');}
}catch(e){setTheme('dark');}

send.onclick=kirim;
inp.addEventListener('input',autosize);
inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();kirim();}
});
document.querySelectorAll('.chip').forEach(function(c){
  c.onclick=function(){inp.value=c.textContent.replace(/^\S+\s/,'')+' : ';inp.focus();autosize();};
});
/* mic */
mic.onclick=function(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addMsg('ryu',mdRender('🎤 Mic tidak didukung browser ini.'));return;}
  var r=new SR();r.lang='id-ID';mic.classList.add('rec');
  r.onresult=function(e){inp.value+=(inp.value?' ':'')+e.results[0][0].transcript;autosize();};
  r.onerror=function(){addMsg('ryu',mdRender('🎤 Mic gagal atau izin ditolak.'));};
  r.onend=function(){mic.classList.remove('rec');};
  r.start();
};
/* sheet pengaturan */
function openSheet(o){sheet.classList.toggle('open',o);backdrop.classList.toggle('show',o);}
document.getElementById('setBtn').onclick=function(){openSheet(true);};
document.getElementById('closeSheet').onclick=function(){openSheet(false);};
backdrop.onclick=function(){openSheet(false);};
document.getElementById('themeBtn').onclick=toggleTheme;
document.getElementById('themeBtn2').onclick=toggleTheme;
document.getElementById('fsRange').oninput=function(){
  document.documentElement.style.setProperty('--fs',this.value+'px');
  try{localStorage.setItem('ryu-fs',this.value);}catch(e){}
};
document.getElementById('clearChat').onclick=function(){
  chat.innerHTML='';openSheet(false);sapa();
};
function sapa(){
  addMsg('ryu',mdRender(
    'Halo! Saya **Ryu** 🐍 — otak Qwen3 menyala, tampilan sudah **v2.0 bersih**.\n\n'+
    '- Ketik pertanyaan apa saja di bawah\n'+
    '- Atau sentuh chip untuk mulai cepat\n'+
    '- Setiap blok kode punya tombol **📋 Copy**\n'+
    '- ⚙️ untuk tema gelap/terang & ukuran teks'
  ));
}
sapa();
</script>
</body>
</html>
